<div class="address-list">
  <mat-form-field>
    <mat-label>Straße</mat-label>
    <input matInput
           [value]="streetInput()"
           (input)="streetInput.set($any($event.target).value)"
           (keyup.enter)="search()"/>
  </mat-form-field>

  <button mat-flat-button (click)="search()">Suchen</button>
</div>

<table mat-table [dataSource]="addresses.value()?.items ?? []">
  <ng-container matColumnDef="street">
    <th mat-header-cell *matHeaderCellDef>Straße</th>
    <td mat-cell *matCellDef="let a ">{{a.street}}</td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let a; columns: columns" (click)="selected.emit(a.id)"></tr>
</table>

<mat-paginator
  [length]="addresses.value()?.total ?? 0"
  [pageSize]="query().pageSize"
  [pageIndex]="query().page - 1"
  [pageSizeOptions]="[10, 25, 50, 100]"
  (page)="onPage($event)" />
