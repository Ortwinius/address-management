<mat-sidenav-container class="h-full">
  <mat-sidenav position="end" class="max-w-full"
               [mode]="phone() ? 'over' : 'side'"
               [opened]="panelOpen()"
               (closedStart)="store.close()">
    <div class="flex items-center gap-2 pt-2 pr-2 pl-6">
      <h2 class="flex-1 text-xl font-medium">{{ titles[store.mode()] }}</h2>
      <button mat-icon-button aria-label="Schließen" (click)="store.close()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="px-6 py-4">
      @switch (store.mode()) {
        @case ('view') {
          <app-addresses-detail/>
        }
        @case ('edit') {
          @if (store.selected(); as address) {
            <app-addresses-form [address]="address"/>
          }
        }
        @case ('new') {
          <app-addresses-form/>
        }
      }
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <app-addresses-list [compact]="panelOpen() || phone()"/>
  </mat-sidenav-content>
</mat-sidenav-container>
