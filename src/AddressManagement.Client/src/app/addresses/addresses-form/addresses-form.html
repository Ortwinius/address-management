<div class="flex flex-col">
  @for (field of fields; track field) {
    <mat-form-field class="mt-1">
      <mat-label>{{ labels[field] }}</mat-label>
      <input matInput [formField]="form[field]" />
      @for (e of form[field]().errors(); track $index) {
        <mat-error>{{ e.message ?? e.kind }}</mat-error>
      }
    </mat-form-field>
  }
</div>

<div class="flex gap-2">
  <button mat-flat-button [disabled]="form().invalid() || store.busy()" (click)="save()">
    @if (store.busy()) {
      <mat-spinner diameter="18" />
    } @else {
      Save
    }
  </button>
  <button mat-button (click)="store.cancelEdit()">Cancel</button>
</div>
